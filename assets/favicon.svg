<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sleek rounded squircle background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Crescent Moon Symbol -->
  <path d="M 37 14 C 25.4 14 16 23.4 16 35 C 16 46.6 25.4 56 37 56 C 41.5 56 45.7 54.6 49.1 52.2 C 38.8 51.5 30.5 42.8 30.5 32 C 30.5 22.8 36.8 15.1 45.4 13.2 C 42.8 12.4 40 12 37 12 Z" fill="url(#moonGrad)"/>

  <!-- AI Intelligence Spark (Emerald 4-Pointed Star) -->
  <g filter="url(#glow)">
    <path d="M 44 14 C 44 20 48 24 54 24 C 48 24 44 28 44 34 C 44 28 40 24 34 24 C 40 24 44 20 44 14 Z" fill="url(#sparkGrad)"/>
    <circle cx="44" cy="24" r="2" fill="#A7F3D0"/>
  </g>
</svg>
